name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build binaries
        run: |
          VERSION="${{ github.ref_name }}"
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o local-kms_linux-amd64   ./cmd/local-kms
          GOOS=linux  GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o local-kms_linux-arm64   ./cmd/local-kms
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o local-kms_darwin-amd64  ./cmd/local-kms

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            local-kms_linux-amd64
            local-kms_linux-arm64
            local-kms_darwin-amd64
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version tags
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(echo "$TAG" | sed 's/^v//')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            nsmithuk/local-kms:${{ steps.version.outputs.version }}
            nsmithuk/local-kms:${{ steps.version.outputs.major }}
            # nsmithuk/local-kms:latest
