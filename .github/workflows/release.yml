name: release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local-kms
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build binary
        run: go build -o local-kms ./cmd/local-kms

      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: nsmithuk/local-kms-tests
          ref: dev
          path: tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        working-directory: tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start local-kms
        run: |
          export KMS_SEED_PATH=test/seed-v2.yaml
          ./local-kms &
          sleep 3

      - name: Run tests
        working-directory: tests
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Extract version info
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="$TAG"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          if echo "$VERSION" | grep -q '-'; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          VERSION="${{ github.ref_name }}"
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o local-kms_linux-amd64   ./cmd/local-kms
          GOOS=linux  GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o local-kms_linux-arm64   ./cmd/local-kms
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o local-kms_macos-amd64   ./cmd/local-kms
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o local-kms_macos-arm64   ./cmd/local-kms

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            local-kms_linux-amd64
            local-kms_linux-arm64
            local-kms_macos-amd64
            local-kms_macos-arm64
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version info
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="$TAG"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          if echo "$VERSION" | grep -q '-'; then
            DOCKER_TAGS="nsmithuk/local-kms:${VERSION}"
          else
            DOCKER_TAGS="nsmithuk/local-kms:${VERSION},nsmithuk/local-kms:${MAJOR}"
          fi
          {
            echo "docker_tags<<EOF"
            echo "$DOCKER_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.version.outputs.docker_tags }}
